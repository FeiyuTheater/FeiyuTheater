name: Preview Jekyll site (PR)

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to preview'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: development

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
          path: ./_site
          retention-days: 3

      - name: Comment preview artifact link on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? Number(process.env.PR_NUMBER_INPUT);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### 🔍 Jekyll Preview Built\n\nThe site artifact for this PR is ready.\n[Download preview artifact](${runUrl})\n\n_Expires in 3 days. Extract the zip and open \`index.html\` locally._`
            });
